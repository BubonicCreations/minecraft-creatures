  entity/armadillo/armadillo_baby:
    faces:
      head.north:
        prompt: The face of a baby pink-brown armadillo, small dark eyes seen straight from the front, filling the whole frame
        denoise: 0.85
      '*': Close-up of hard glossy horn-like plates with fine growth lines
  entity/axolotl/axolotl_blue:
    faces:
      head.north:
        prompt: The face of a blue axolotl with frilly gills seen straight from the front, filling the whole frame
