# Colour variants and babies of every mob (2026-10-26), after recipes/mobfaces-main(-fix).yaml:
# only head fronts name the animal; snouts (cubes in front of the head, found from the model by a
# scratch script) describe the nose alone; bodies use flat hide / fur rug / leather / rubber / cloth
# swatch words, never "skin" (human faces appear). Run: uv run mcreskin mobfaces recipes/mobfaces-variants.yaml
seeds:
  2601: 0.75
style: Photorealistic macro photograph seen perfectly straight-on, flat even soft lighting, sharp focus, the surface fills the whole image edge to edge, no background, no object.
