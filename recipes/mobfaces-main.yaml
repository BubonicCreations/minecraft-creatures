# Every mob's main texture as a picture per model face (2026-10-26, after the pilot of the cow, pig
# and zombie in recipes/mobfaces-pilot.yaml). Rules from the pilot: only head fronts name the
# animal (denoise 0.85); noses, beaks and every other face describe the surface alone (0.75), or
# Qwen paints a whole animal, head or garment on each face. Written by a table in the session
# scratchpad; edit here. Run: uv run mcreskin mobfaces recipes/mobfaces-main.yaml
seeds:
  2501: 0.75
style: Photorealistic macro photograph seen perfectly straight-on, flat even soft lighting, sharp focus, the surface fills the whole image edge to edge, no background, no object.
