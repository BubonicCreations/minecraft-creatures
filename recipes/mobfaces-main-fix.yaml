# Repaints of recipes/mobfaces-main.yaml s2501 faces that grew stray faces (2026-10-26). Lesson:
# "skin" and "creature" on a body face give human faces and torsos; "flat hide / leather / rubber /
# cloth swatch" do not. Good faces are kept from s2501. Run: uv run mcreskin mobfaces recipes/mobfaces-main-fix.yaml
seeds:
  2502: 0.75
style: Photorealistic macro photograph seen perfectly straight-on, flat even soft lighting, sharp focus, the surface fills the whole image edge to edge, no background, no object.
textures:
  entity/villager2/villager:
    keep:
      from: 2501
      faces:
      - head.north
      - nose.*
    faces:
      head.*: Close-up of a flat patch of tanned weathered skin with fine pores
      helmet.*: Close-up of a flat patch of tanned weathered skin with fine pores
      arms#2.*: Close-up of a flat patch of tanned weathered skin with fine pores
      '*': Close-up of a flat swatch of coarse brown woven wool cloth with a few stains
  entity/zombie_villager2/zombie-villager:
    keep:
      from: 2501
      faces:
      - head.north
      - head#1.north
    faces:
      head*: Close-up of a flat rotting grey-green leather hide with pores, blotches and faint dark veins
      rightArm.*: Close-up of a flat rotting grey-green leather hide with pores, blotches and faint dark veins
      '*': Close-up of a flat swatch of coarse torn dirty brown woven wool cloth with a few stains
  entity/illager/evoker:
    keep:
      from: 2501
      faces:
      - head.north
    faces:
      nose.north: &id001
        prompt: Extreme close-up of the tip of a long large nose seen from the front, two nostrils at the bottom, weathered skin with fine pores, filling the whole frame
        denoise: 0.75
      head.*: Close-up of a flat patch of grey weathered skin with fine pores
      nose.*: Close-up of a flat patch of grey weathered skin with fine pores
      arms#2.*: Close-up of a flat patch of grey weathered skin with fine pores
      '*': Close-up of a flat swatch of black woven wool cloth with a gold thread trim
  entity/vindicator:
    keep:
      from: 2501
      faces:
      - head.north
    faces:
      nose.north: *id001
      head.*: Close-up of a flat patch of grey weathered skin with fine pores
      nose.*: Close-up of a flat patch of grey weathered skin with fine pores
      arms#2.*: Close-up of a flat patch of grey weathered skin with fine pores
      '*': Close-up of a flat swatch of coarse dark grey-green woven wool cloth with a few stains
  entity/pillager:
    keep:
      from: 2501
      faces:
      - head.north
    faces:
      nose.north: *id001
      head.*: Close-up of a flat patch of grey weathered skin with fine pores
      nose.*: Close-up of a flat patch of grey weathered skin with fine pores
      arms#2.*: Close-up of a flat patch of grey weathered skin with fine pores
      '*': Close-up of a flat swatch of coarse dark brown woven wool cloth with a few stains
